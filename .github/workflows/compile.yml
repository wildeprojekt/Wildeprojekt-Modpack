name: Compile .mrpack
on:
  workflow_dispatch:
jobs:
  compile-mrpack:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Create mrpack archive
      run: |
        zip -r repo.mrpack .
    - name: Create tag
      id: create_tag
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git tag -a version-$(date +%Y-%m-%d-%H-%M-%S) -m "Compile .mrpack"
        git push origin version-$(date +%Y-%m-%d-%H-%M-%S)
        echo "::set-output name=tag_name::$(date +%Y-%m-%d-%H-%M-%S)"

    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.create_tag.outputs.tag_name }}
        release_name: Compile .mrpack ${{ steps.create_tag.outputs.tag_name }}
        body: |
          Compiled .mrpack file
        draft: false
        prerelease: true

    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./repo.mrpack
        asset_name: Wildeprojekt_${{ steps.create_tag.outputs.tag_name }}.mrpack
        asset_content_type: application/zip
